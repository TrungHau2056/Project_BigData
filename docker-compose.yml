services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ecommerce-events
      DATA_FILE: data/2019-Oct.csv
      SEND_DELAY_SEC: 0.5
    command: ["python", "process_data.py"]
    volumes:
      - ./:/app

  spark-streaming:
    image: apache/spark:3.5.1
    depends_on:
      kafka:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      HOME: /tmp
      ES_NODES: elasticsearch
      ES_PORT: 9200
      ES_INDEX: ecommerce-events
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ecommerce-events
      SPARK_KAFKA_PACKAGE: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
      
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
      - /app/spark_streaming.py
    volumes:
      - ./:/app

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  es-init:
    image: curlimages/curl
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c "
      until curl -s http://elasticsearch:9200 >/dev/null; do
        sleep 3;
      done;
      
      curl -X PUT http://elasticsearch:9200/_index_template/ecommerce_template \
      -H 'Content-Type: application/json' \
      -d '{
        \"index_patterns\": [\"ecommerce-events*\"],
        \"template\": {
          \"mappings\": {
            \"properties\": {
              \"event_time\": {
                \"type\": \"date\",
                \"format\": \"strict_date_optional_time||epoch_millis\"
              },
              \"event_type\": {\"type\": \"keyword\"},
              \"category_code\": {\"type\": \"keyword\"},
              \"category_l1\": {\"type\": \"keyword\"},
              \"category_l2\": {\"type\": \"keyword\"},
              \"category_l3\": {\"type\": \"keyword\"},
              \"brand\": {\"type\": \"keyword\"},
              \"user_session\": {\"type\": \"keyword\"},
              \"price\": {\"type\": \"float\"}
            }
          }
        }
      }'
      "
  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
