services:
  # ==========================================
  # Infrastructure
  # ==========================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: QlIHWhbmSMWCMubdAfweUw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Creating topic ecommerce-events...';
    
      kafka-topics \
      --create \
      --topic ecommerce-events \
      --bootstrap-server kafka:29092 \
      --partitions 1 \
      --replication-factor 1;

      echo '-----------------------------------';
      echo 'Verifying topic list:';
      kafka-topics --list --bootstrap-server kafka:29092;
      echo '-----------------------------------';
      echo 'Kafka topic setup complete.';
      "
    restart: "no"

  minio:
    image: minio/minio:latest
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/ecommerce-datalake --ignore-existing;
      echo 'Bucket created successfully';
      "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.4.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

  # ==========================================
  # Data Pipeline (Batch Layer)
  # ==========================================
  ingest-to-lake:
    image: apache/spark:3.5.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

    working_dir: /app
    environment:
      HOME: /tmp
      DATA_FILE: data/2019-Oct.csv
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-datalake
      SPARK_PACKAGES: org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.memory=2g
      - --packages
      - org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      - /app/ingest_to_lake.py
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  feature-engineering:
    image: apache/spark:3.5.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    working_dir: /app
    environment:
      HOME: /tmp
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-datalake
      ES_NODES: elasticsearch
      ES_PORT: 9200
      SPARK_PACKAGES: org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.memory=2g
      - --packages
      - org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
      - /app/feature_engineering.py
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  stream-replay:
    image: python:3.11-slim
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      spark-streaming:
        condition: service_started
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ecommerce-events
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-datalake
      REPLAY_START_DATE: "2019-10-25"
      MAX_GAP_SECONDS: "5.0"
    command: >
      bash -c "pip install pyarrow kafka-python --quiet &&
               python streaming/stream_replay.py"
    volumes:
      - ./:/app
  # ==========================================
  # Batch Processing
  # ==========================================
  spark-batch:
    image: apache/spark:3.5.1
    depends_on:
      - elasticsearch
    working_dir: /app
    environment:
      HOME: /tmp
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-datalake
      ES_NODES: elasticsearch
      ES_PORT: 9200
      SPARK_PACKAGES: org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.driver.memory=2g
      - --packages
      - org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
      - /app/spark_batch.py
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  customer-segmentation:
    image: apache/spark:3.5.1
    depends_on:
      - elasticsearch
    working_dir: /app
    environment:
      HOME: /tmp
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ecommerce-datalake
      ES_NODES: elasticsearch
      ES_PORT: 9200
      NUM_CLUSTERS: 4
      SPARK_PACKAGES: org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
    entrypoint: /bin/bash -c "pip install numpy && /opt/spark/bin/spark-submit --master local[*] --conf spark.jars.ivy=/tmp/.ivy2 --conf spark.driver.memory=2g --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3 /app/customer_segmentation.py"
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  # ==========================================
  # Streaming Processing (Speed Layer)
  # ==========================================
  spark-streaming:
    image: apache/spark:3.5.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    working_dir: /app
    environment:
      HOME: /tmp
      ES_NODES: elasticsearch
      ES_PORT: 9200
      ES_INDEX: ecommerce-events
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ecommerce-events
      WINDOW_DURATION: 5 minutes
      WATERMARK_DELAY: 10 minutes
      SPARK_KAFKA_PACKAGE: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      PYTHONPATH: /app
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      - /app/streaming/spark_streaming.py
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  spark-anomaly:
    image: apache/spark:3.5.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    working_dir: /app
    environment:
      PYTHONPATH: /app
      HOME: /tmp
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ecommerce-events
      ES_NODES: elasticsearch
      ES_PORT: 9200
      SPARK_KAFKA_PACKAGE: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.elasticsearch:elasticsearch-spark-30_2.12:8.4.3
      - /app/streaming/streaming_anomaly.py
    volumes:
      - ./:/app
      - ./.ivy-cache:/tmp/.ivy2

  # ==========================================
  # Orchestration (Airflow)
  # ==========================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - elasticsearch
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/bash -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-data:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    restart: unless-stopped

volumes:
  minio-data:
  airflow-data:
